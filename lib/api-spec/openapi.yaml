openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /swap/quote:
    post:
      operationId: getSwapQuote
      tags: [swap]
      summary: Get a firm on-chain swap quote
      description: Requests an executable Robinhood Chain mainnet quote from the configured liquidity provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapQuoteInput"
      responses:
        "200":
          description: Executable swap quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapQuote"
        "400":
          description: Invalid request or unavailable route
        "403":
          description: Asset is not available to the wallet or region due to trading restrictions
        "503":
          description: Quote provider is not configured or temporarily unavailable
  /swap/assets:
    get:
      operationId: getSwapAssets
      tags: [swap]
      summary: List verified Robinhood Chain swap assets
      description: Returns verified crypto assets and active Robinhood Stock Token deployments for Robinhood Chain.
      responses:
        "200":
          description: Verified Robinhood Chain asset catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapAssetCatalog"
        "503":
          description: The Robinhood asset registry is temporarily unavailable
  /portfolio/prices:
    post:
      operationId: getPortfolioPrices
      tags: [portfolio]
      summary: Get live indicative portfolio prices
      description: Resolves live USDG prices for held Robinhood Chain assets without storing wallet data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioPricesInput"
      responses:
        "200":
          description: Indicative prices for the requested assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioPricesResponse"
        "400":
          description: Invalid portfolio price request
        "429":
          description: Too many portfolio price requests
        "503":
          description: Price provider is not configured or temporarily unavailable
  /explore/markets:
    post:
      operationId: getExploreMarkets
      tags: [explore]
      summary: Get live Explore market routes
      description: Resolves public, read-only indicative USDG routes for verified Robinhood Chain assets without a wallet or transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreMarketsInput"
      responses:
        "200":
          description: Indicative market routes for the requested assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreMarketsResponse"
        "400":
          description: Invalid or unverified asset request
        "429":
          description: Too many market requests
        "503":
          description: Market provider is not configured or temporarily unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SwapQuoteInput:
      type: object
      required:
        - sellToken
        - buyToken
        - sellAmount
        - taker
        - slippageBps
      properties:
        sellToken:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        buyToken:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        sellAmount:
          type: string
          pattern: "^[1-9][0-9]*$"
        taker:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        slippageBps:
          type: number
          minimum: 1
          maximum: 1000
          multipleOf: 1
    SwapTransaction:
      type: object
      required:
        - to
        - data
        - value
      properties:
        to:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        data:
          type: string
          pattern: "^0x[a-fA-F0-9]*$"
        value:
          type: string
          pattern: "^[0-9]+$"
        gas:
          type: ["string", "null"]
        gasPrice:
          type: ["string", "null"]
    SwapQuote:
      type: object
      required:
        - sellAmount
        - buyAmount
        - minBuyAmount
        - liquidityAvailable
        - allowanceTarget
        - sources
        - transaction
      properties:
        sellAmount:
          type: string
          pattern: "^[0-9]+$"
        buyAmount:
          type: string
          pattern: "^[0-9]+$"
        minBuyAmount:
          type: string
          pattern: "^[0-9]+$"
        liquidityAvailable:
          type: boolean
        allowanceTarget:
          type: ["string", "null"]
          pattern: "^0x[a-fA-F0-9]{40}$"
        sources:
          type: array
          items:
            type: string
        transaction:
          $ref: "#/components/schemas/SwapTransaction"
    SwapAsset:
      type: object
      required:
        - id
        - address
        - symbol
        - name
        - decimals
        - category
        - logoUrl
        - isNative
      properties:
        id:
          type: string
        address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: number
          minimum: 0
          maximum: 36
          multipleOf: 1
        category:
          type: string
          enum: [crypto, stock, etf]
        logoUrl:
          type: ["string", "null"]
        isNative:
          type: boolean
    SwapAssetCatalog:
      type: object
      required:
        - assets
        - refreshedAt
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/SwapAsset"
        refreshedAt:
          type: string
          format: date-time
    PortfolioPriceAssetInput:
      type: object
      required:
        - address
        - sellAmount
      properties:
        address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        sellAmount:
          type: string
          pattern: "^[1-9][0-9]*$"
    PortfolioPricesInput:
      type: object
      required:
        - taker
        - assets
      properties:
        taker:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        assets:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/PortfolioPriceAssetInput"
    PortfolioPrice:
      type: object
      required:
        - address
        - available
        - buyAmount
        - source
        - error
      properties:
        address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        available:
          type: boolean
        buyAmount:
          type: ["string", "null"]
          pattern: "^[1-9][0-9]*$"
        source:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
    PortfolioPricesResponse:
      type: object
      required:
        - prices
        - refreshedAt
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPrice"
        refreshedAt:
          type: string
          format: date-time
    ExploreMarketsInput:
      type: object
      required:
        - addresses
      properties:
        addresses:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            pattern: "^0x[a-fA-F0-9]{40}$"
    ExploreMarket:
      type: object
      required:
        - address
        - available
        - buyAmount
        - source
        - error
      properties:
        address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        available:
          type: boolean
        buyAmount:
          type: ["string", "null"]
          pattern: "^[1-9][0-9]*$"
        source:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
    ExploreMarketsResponse:
      type: object
      required:
        - markets
        - refreshedAt
      properties:
        markets:
          type: array
          items:
            $ref: "#/components/schemas/ExploreMarket"
        refreshedAt:
          type: string
          format: date-time

